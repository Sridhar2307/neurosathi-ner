<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="45%" stop-color="#0B3C39"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Warm Organic Gradient (Memory / Human Sathi) -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- AI / Digital Teal Gradient (Neuro / Intelligence) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Gold Accent for NER -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Inner Shadow for tactile feel -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base App Background (Squircle / Rounded Canvas) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="220" r="180" fill="url(#ambientGlow)"/>

  <!-- Subtle Outer Rim / Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-opacity="0.3"/>

  <!-- MAIN EMBLEM CONTAINER (Centered) -->
  <g transform="translate(256, 215)">
    <!-- Central Synapse Pulse Bridge (Infinity / Companion Bond) -->
    <path d="M-18 -8 C-8 -22 8 -22 18 -8 C8 6 -8 6 -18 -8 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="0" cy="-8" r="4" fill="#5EEAD4" />

    <!-- ================= LEFT HEMISPHERE (Warm Memory / Human Care) ================= -->
    <g>
      <!-- Main Upper Lobe -->
      <path d="M-16 -120 C-65 -120 -125 -82 -125 -25 C-125 10 -105 42 -88 52 C-76 59 -66 70 -66 84 C-66 100 -52 110 -35 110 C-22 110 -16 98 -16 82 Z"
            fill="url(#warmGrad)" />

      <!-- Synaptic Curves & Nodes (Classic Vector Cutouts) -->
      <!-- Node 1: Top Memory Point -->
      <circle cx="-68" cy="-65" r="9" fill="#FFFFFF" />
      <!-- Node 2: Center Heart/Memory -->
      <circle cx="-85" cy="0" r="11" fill="#FFFFFF" />
      <!-- Node 3: Lower Anchor -->
      <circle cx="-42" cy="55" r="8" fill="#FFFFFF" />

      <!-- Connecting Neural Pathways -->
      <path d="M-68 -65 L-85 0 L-42 55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
      <!-- Subsidiary Synapse -->
      <path d="M-85 0 L-32 0" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
      <circle cx="-32" cy="0" r="5" fill="#FEF3C7" />
    </g>

    <!-- ================= RIGHT HEMISPHERE (AI / Digital Cognition) ================= -->
    <g>
      <!-- Main Upper Lobe -->
      <path d="M16 -120 C65 -120 125 -82 125 -25 C125 10 105 42 88 52 C76 59 66 70 66 84 C66 100 52 110 35 110 C22 110 16 98 16 82 Z"
            fill="url(#tealGrad)" />

      <!-- Digital Circuit Paths & Nodes -->
      <!-- Horizontal Tech Bars -->
      <rect x="36" y="-72" width="46" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
      <circle cx="90" cy="-68" r="6" fill="#FFFFFF" />

      <rect x="36" y="-36" width="62" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
      <circle cx="106" cy="-32" r="6" fill="#FFFFFF" />

      <rect x="36" y="0" width="50" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
      <circle cx="94" cy="4" r="6" fill="#FFFFFF" />

      <rect x="30" y="36" width="40" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
      <circle cx="78" cy="40" r="6" fill="#FFFFFF" />

      <!-- Circuit link line -->
      <path d="M42 -72 L42 40" stroke="#CCFBF1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>

    <!-- Central Vertical Energy Stem -->
    <line x1="0" y1="-125" x2="0" y2="95" stroke="#14B8A6" stroke-width="3.5" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- ================= TYPOGRAPHY & BRAND BADGE ================= -->
  <!-- Sleek Dark Pill Container -->
  <rect x="86" y="382" width="340" height="68" rx="34" fill="#021C1B" stroke="#0D9488" stroke-width="2.5" />

  <!-- "NEUROSATHI" Text -->
  <text x="228" y="426" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">
    NEUROSATHI
  </text>

  <!-- "NER" Badge Pill in Gold -->
  <rect x="340" y="396" width="70" height="40" rx="20" fill="url(#goldGrad)" />
  <text x="375" y="424" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#042F2E" letter-spacing="1" text-anchor="middle">
    NER
  </text>
</svg>
